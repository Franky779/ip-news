<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP授权价值评估报告 · 水豚噜噜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @page { size: A4; margin: 20mm 22mm 24mm 22mm; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: oklch(97% 0.006 70);
            --paper: oklch(98.5% 0.004 70);
            --surface: oklch(100% 0.003 70);
            --ink: oklch(20% 0.018 50);
            --ink-2: oklch(38% 0.022 50);
            --ink-3: oklch(55% 0.018 60);
            --ink-4: oklch(72% 0.012 65);
            --rule: oklch(88% 0.012 70);
            --rule-soft: oklch(92% 0.008 70);
            --accent: oklch(38% 0.17 28);
            --accent-2: oklch(52% 0.18 28);
            --accent-tint: oklch(94% 0.025 28);
            --accent-deep: oklch(28% 0.10 28);
            --warn: oklch(56% 0.18 30);
            --hold: oklch(58% 0.13 75);
            --pass: oklch(48% 0.13 145);
            --halftone: oklch(95% 0.008 70);
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.5rem;
            --space-6: 2rem;
            --space-7: 3rem;
            --space-8: 4rem;
            --space-9: 6rem;
            --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --latin: "EB Garamond", "Noto Serif SC", serif;
        }

        body {
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.78;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            font-feature-settings: "palt" 1;
        }
        .report {
            max-width: 210mm;
            margin: 0 auto;
            background: var(--paper);
            box-shadow: 0 1px 2px oklch(20% 0.01 60 / 0.04), 0 24px 60px oklch(20% 0.01 60 / 0.08);
        }
        .page { padding: var(--space-7) var(--space-8) var(--space-8); page-break-after: always; position: relative; }
        .page:last-child { page-break-after: auto; }

        /* ========== 封面 ========== */
        .cover {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 297mm;
            padding: var(--space-7) var(--space-8) var(--space-8);
            background:
                radial-gradient(circle at 88% 8%, oklch(94% 0.04 28 / 0.55) 0, transparent 38%),
                radial-gradient(circle at 6% 96%, oklch(96% 0.03 60 / 0.6) 0, transparent 42%),
                var(--paper);
            position: relative;
            overflow: hidden;
        }
        .cover::before {
            content: "";
            position: absolute;
            inset: var(--space-7) var(--space-8);
            border: 1px solid var(--rule);
            pointer-events: none;
        }
        .cover-topbar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: var(--latin);
            font-size: 11px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--ink-2);
            padding: var(--space-3) var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--rule);
            position: relative;
            z-index: 1;
        }
        .cover-topbar-brand { color: var(--accent); font-weight: 500; }
        .cover-topbar-docid { color: var(--ink-3); font-feature-settings: "tnum" 1; letter-spacing: 0.18em; }

        .cover-body {
            display: grid;
            align-content: center;
            justify-items: start;
            padding: 0 var(--space-5);
            position: relative;
            z-index: 1;
        }
        .cover-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-family: var(--latin);
            font-style: italic;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 0.04em;
            margin-bottom: var(--space-4);
        }
        .cover-eyebrow::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--accent);
        }
        .cover-ip-name {
            font-family: var(--serif);
            font-size: clamp(3.25rem, 7vw, 4.75rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.01em;
            color: var(--ink);
            margin-bottom: var(--space-3);
        }
        .cover-ip-en {
            font-family: var(--latin);
            font-size: 16px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin-bottom: var(--space-7);
            font-weight: 500;
        }
        .cover-title {
            font-family: var(--serif);
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: var(--space-2);
        }
        .cover-subtitle {
            font-size: 13px;
            color: var(--ink-3);
            margin-bottom: var(--space-7);
            font-feature-settings: "tnum" 1;
        }
        .cover-verdict {
            background: var(--paper);
            border: 1px solid var(--rule);
            padding: var(--space-5) var(--space-6);
            max-width: 540px;
            position: relative;
        }
        .cover-verdict::before {
            content: "\300C";
            position: absolute;
            top: -0.3em;
            left: -0.1em;
            font-family: var(--serif);
            font-size: 4rem;
            line-height: 1;
            color: var(--accent);
            opacity: 0.18;
        }
        .cover-verdict-label {
            font-family: var(--latin);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.32em;
            margin-bottom: var(--space-3);
        }
        .cover-verdict-text {
            font-family: var(--serif);
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.85;
        }
        .cover-verdict-text strong { font-weight: 700; color: var(--accent-deep); }

        .cover-stamp {
            position: absolute;
            top: 50%;
            right: var(--space-7);
            transform: translateY(-50%) rotate(-12deg);
            width: 132px;
            height: 132px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--accent);
            font-family: var(--latin);
            opacity: 0.62;
            z-index: 0;
        }
        .cover-stamp::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid var(--accent);
            border-radius: 50%;
        }
        .cover-stamp-text {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .cover-stamp-num {
            font-family: var(--serif);
            font-size: 1.6rem;
            font-weight: 900;
            line-height: 1;
            margin: 4px 0 2px;
            letter-spacing: -0.02em;
        }

        .cover-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: var(--space-5) var(--space-4) var(--space-3);
            border-top: 1px solid var(--rule);
            position: relative;
            z-index: 1;
        }
        .cover-meta {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink-3);
            line-height: 1.85;
        }
        .cover-meta p { margin: 1px 0; }
        .cover-meta .label { font-family: var(--latin); font-size: 9px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }
        .cover-confidential {
            font-family: var(--latin);
            font-size: 10px;
            color: var(--ink-3);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            text-align: right;
        }

        /* ========== 页眉 ========== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: var(--latin);
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--rule);
            margin-bottom: var(--space-7);
        }
        .page-header-brand { color: var(--accent); font-weight: 700; }
        .page-header-meta { color: var(--ink-3); font-feature-settings: "tnum" 1; letter-spacing: 0.18em; }

        /* ========== 章节标题 ========== */
        .section-title {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: end;
            gap: var(--space-5);
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--ink);
        }
        .section-title .num {
            font-family: var(--latin);
            font-size: 3rem;
            font-weight: 500;
            line-height: 0.85;
            color: var(--accent);
            font-feature-settings: "lnum" 1, "tnum" 1;
        }
        .section-title .title-text {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
        }
        .section-title .title-en {
            display: block;
            font-family: var(--latin);
            font-style: italic;
            font-size: 12px;
            color: var(--ink-3);
            letter-spacing: 0.04em;
            margin-top: 4px;
            font-weight: 400;
        }

        /* ========== 执行摘要 ========== */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            margin-bottom: var(--space-6);
            border: 1px solid var(--rule);
        }
        .summary-card {
            padding: var(--space-5) var(--space-4);
            border-right: 1px solid var(--rule);
            background: var(--surface);
            position: relative;
        }
        .summary-card:last-child { border-right: none; }
        .summary-card-label {
            font-family: var(--latin);
            font-size: 9px;
            font-weight: 700;
            color: var(--ink-3);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: var(--space-3);
        }
        .summary-card-value {
            font-family: var(--serif);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.1;
        }
        .summary-card-value.high { color: var(--warn); }
        .summary-card-value.medium { color: var(--accent); }
        .summary-card-value.low { color: var(--pass); }
        .summary-card-note {
            font-size: 11px;
            color: var(--ink-3);
            margin-top: 6px;
        }

        .verdict-box {
            position: relative;
            background: var(--accent-tint);
            padding: var(--space-5) var(--space-6);
            margin-bottom: var(--space-6);
            border: 1px solid oklch(88% 0.025 28);
        }
        .verdict-box::before {
            content: "VERDICT";
            position: absolute;
            top: -10px;
            left: var(--space-6);
            background: var(--paper);
            padding: 0 var(--space-3);
            font-family: var(--latin);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.32em;
            color: var(--accent);
        }
        .verdict-box h4 {
            font-family: var(--serif);
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-deep);
            margin-bottom: var(--space-3);
            letter-spacing: 0.04em;
        }
        .verdict-box p {
            font-size: 14px;
            color: var(--ink);
            line-height: 1.92;
        }
        .verdict-box .highlight {
            background: oklch(88% 0.06 28 / 0.5);
            padding: 0 4px;
            font-weight: 600;
            color: var(--accent-deep);
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .section-eyebrow {
            font-family: var(--latin);
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-3);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .section-eyebrow::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--rule);
        }

        .key-points {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4) var(--space-5);
        }
        .key-point {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: var(--space-4);
            padding: var(--space-4) 0;
            border-top: 1px solid var(--rule);
        }
        .key-point-num {
            font-family: var(--latin);
            font-size: 2rem;
            font-weight: 500;
            color: var(--accent);
            line-height: 1;
            font-feature-settings: "lnum" 1, "tnum" 1;
        }
        .key-point-text h5 {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .key-point-text p {
            font-size: 12.5px;
            color: var(--ink-2);
            line-height: 1.7;
        }

        /* ========== IP画像 ========== */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin-bottom: var(--space-5);
            border: 1px solid var(--rule);
        }
        .profile-block {
            padding: var(--space-5);
            background: var(--surface);
            border-right: 1px solid var(--rule);
        }
        .profile-block:last-child { border-right: none; }
        .profile-grid .profile-block:nth-child(2) { border-right: none; }
        .profile-block.full {
            grid-column: 1 / -1;
            border-right: none;
            border-top: 1px solid var(--rule);
        }
        .profile-block h4 {
            font-family: var(--latin);
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: var(--space-4);
        }
        .profile-block ul {
            list-style: none;
            padding: 0;
        }
        .profile-block li {
            font-size: 13px;
            color: var(--ink-2);
            line-height: 1.78;
            padding: var(--space-2) 0;
            border-bottom: 1px dashed var(--rule-soft);
            display: grid;
            grid-template-columns: 6em 1fr;
            gap: var(--space-3);
        }
        .profile-block li:last-child { border-bottom: none; }
        .profile-block li::before {
            content: attr(data-label);
            font-family: var(--latin);
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-3);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding-top: 4px;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            font-family: var(--sans);
            font-size: 11.5px;
            padding: 4px 12px;
            background: oklch(96% 0.008 60);
            color: var(--ink-2);
            border: 1px solid var(--rule);
            border-radius: 100px;
            font-weight: 500;
        }
        .tag.hot {
            background: var(--accent);
            color: var(--paper);
            border-color: var(--accent);
        }

        .rate-bar {
            margin-top: var(--space-5);
            padding: var(--space-5);
            background: var(--surface);
            border: 1px solid var(--rule);
        }
        .rate-bar-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: var(--space-3);
        }
        .rate-bar-label {
            font-size: 12px;
            color: var(--ink-2);
            font-weight: 600;
        }
        .rate-bar-value {
            font-family: var(--latin);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            font-feature-settings: "lnum" 1, "tnum" 1;
        }
        .rate-bar-track {
            height: 4px;
            background: var(--rule);
            position: relative;
            overflow: hidden;
        }
        .rate-bar-fill {
            height: 100%;
            background: var(--accent);
            position: relative;
        }
        .rate-bar-fill::after {
            content: "";
            position: absolute;
            right: -3px;
            top: -4px;
            width: 6px;
            height: 12px;
            background: var(--accent);
        }
        .rate-bar-scale {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-2);
            font-family: var(--latin);
            font-size: 10px;
            color: var(--ink-3);
            font-feature-settings: "tnum" 1;
        }
        .rate-bar-note {
            font-size: 11.5px;
            color: var(--ink-3);
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px dashed var(--rule);
        }

        /* ========== 品类饱和度 ========== */
        .sat-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: var(--space-6);
            font-size: 13px;
            border-top: 2px solid var(--ink);
            border-bottom: 1px solid var(--ink);
        }
        .sat-table th {
            text-align: left;
            font-family: var(--latin);
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-3);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: var(--space-3) var(--space-3);
            border-bottom: 1px solid var(--ink-3);
        }
        .sat-table td {
            padding: var(--space-3) var(--space-3);
            border-bottom: 1px solid var(--rule);
            vertical-align: top;
            color: var(--ink-2);
        }
        .sat-table tr:last-child td { border-bottom: none; }
        .sat-table td strong {
            font-family: var(--serif);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ink);
        }
        .sat-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 10px 3px 6px;
            font-family: var(--sans);
        }
        .sat-badge.red { color: var(--warn); background: oklch(96% 0.04 30); }
        .sat-badge.yellow { color: var(--hold); background: oklch(96% 0.04 75); }
        .sat-badge.green { color: var(--pass); background: oklch(95% 0.04 145); }
        .sat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sat-badge.red .sat-dot { background: var(--warn); }
        .sat-badge.yellow .sat-dot { background: var(--hold); }
        .sat-badge.green .sat-dot { background: var(--pass); }
        .sat-reason { font-size: 12px; color: var(--ink-3); line-height: 1.65; }

        .warning-box {
            background: var(--surface);
            border: 1px solid var(--rule);
            border-top: 3px double var(--accent);
            padding: var(--space-5) var(--space-6);
        }
        .warning-box h4 {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-deep);
            margin-bottom: var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .warning-box h4::before {
            content: "\00A7";
            font-family: var(--latin);
            font-style: italic;
            font-size: 1.4em;
            color: var(--accent);
            font-weight: 400;
        }
        .warning-box p {
            font-size: 13px;
            color: var(--ink-2);
            line-height: 1.85;
        }
        .warning-box strong {
            color: var(--ink);
            background: linear-gradient(transparent 60%, oklch(88% 0.06 28 / 0.5) 60%);
            padding: 0 2px;
        }

        /* ========== 风险清单 ========== */
        .risk-list {
            display: flex;
            flex-direction: column;
            counter-reset: risk;
        }
        .risk-item {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: var(--space-5);
            padding: var(--space-5) 0;
            border-bottom: 1px solid var(--rule);
            counter-increment: risk;
        }
        .risk-item:first-child { padding-top: 0; }
        .risk-level {
            text-align: left;
            position: relative;
        }
        .risk-level::before {
            content: counter(risk, decimal-leading-zero);
            font-family: var(--latin);
            font-size: 2.6rem;
            font-weight: 500;
            color: var(--ink);
            line-height: 0.9;
            display: block;
            font-feature-settings: "lnum" 1, "tnum" 1;
        }
        .risk-level-tag {
            display: inline-block;
            font-family: var(--latin);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-top: var(--space-2);
            padding: 3px 8px;
            border: 1px solid currentColor;
        }
        .risk-item.lvl-high .risk-level::before { color: var(--warn); }
        .risk-item.lvl-high .risk-level-tag { color: var(--warn); }
        .risk-item.lvl-mid-high .risk-level::before { color: oklch(50% 0.16 50); }
        .risk-item.lvl-mid-high .risk-level-tag { color: oklch(50% 0.16 50); }
        .risk-item.lvl-mid .risk-level::before { color: var(--hold); }
        .risk-item.lvl-mid .risk-level-tag { color: var(--hold); }
        .risk-item.lvl-low .risk-level::before { color: var(--pass); }
        .risk-item.lvl-low .risk-level-tag { color: var(--pass); }
        .risk-content h4 {
