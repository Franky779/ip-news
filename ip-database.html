<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例盘点&数据分析 - 新文创商学院老贾聊IP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(97.5% 0.008 75);
            --surface: oklch(100% 0.005 75);
            --text: oklch(22% 0.02 60);
            --text-secondary: oklch(45% 0.03 60);
            --text-muted: oklch(60% 0.02 60);
            --accent: oklch(45% 0.14 45);
            --accent-light: oklch(92% 0.04 45);
            --border: oklch(85% 0.015 75);
            --border-light: oklch(90% 0.01 75);
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.5rem;
            --space-2xl: 4rem;
            --space-3xl: 6rem;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            padding: var(--space-lg) 0;
            text-align: center;
        }

        .brand {
            font-family: "Noto Serif SC", serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .main {
            max-width: 1300px;
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg) var(--space-3xl);
        }

        .page-title {
            font-family: "Noto Serif SC", serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 900;
            color: var(--text);
            margin-bottom: var(--space-xs);
            text-align: center;
        }

        .page-sub {
            font-size: 0.9375rem;
            color: var(--text-muted);
            margin-bottom: var(--space-xl);
            text-align: center;
        }

        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
        }

        @media (max-width: 900px) {
            .columns {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
        }

        .column-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-light);
        }

        .column-header h2 {
            font-family: "Noto Serif SC", serif;
            font-size: 0.9375rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .column-header .count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .file-list {
            list-style: none;
        }

        .file-list li {
            border-bottom: 1px solid var(--border-light);
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .file-list a {
            display: block;
            text-decoration: none;
            color: var(--text);
            font-size: 0.9375rem;
            padding: var(--space-sm) var(--space-lg);
            transition: all 0.2s ease;
            line-height: 1.5;
        }

        .file-list a:hover {
            color: var(--accent);
            background: var(--accent-light);
        }

        .file-list .empty, .file-list .loading, .file-list .error {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8125rem;
            padding: var(--space-xl) var(--space-lg);
        }

        .error { color: #c44; }

        .footer {
            max-width: 1300px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
            border-top: 1px solid var(--border-light);
        }

        .footer p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .back-to-list {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: oklch(30% 0.06 28 / 0.92);
            border: 1px solid oklch(45% 0.10 28 / 0.5);
            border-radius: 999px;
            font-size: 13px;
            color: oklch(96% 0.01 70);
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px oklch(20% 0.02 50 / 0.25);
            transition: all .2s ease;
            letter-spacing: 0.02em;
        }
        .back-to-list:hover {
            color: oklch(98% 0.02 70);
            border-color: oklch(55% 0.14 28 / 0.7);
            transform: translateX(-2px);
            background: oklch(28% 0.08 28 / 0.95);
            text-decoration: none;
        }
        .back-to-list svg { flex-shrink: 0; }
        @media print { .back-to-list { display: none; } }
    </style>
</head>
<body>
<a href="index.html" class="back-to-list" aria-label="返回首页"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</a>

<header class="site-header">
    <div class="brand">新文创老贾聊IP</div>
</header>

<main class="main">
    <h1 class="page-title">案例盘点&数据分析</h1>
    <p class="page-sub" id="pageSub">加载中...</p>

    <div class="columns">
        <div class="column">
            <div class="column-header">
                <h2>品类深度分析报告</h2>
                <div class="count" id="count-category">0 篇</div>
            </div>
            <ul class="file-list" id="list-category">
                <li class="loading">正在读取...</li>
            </ul>
        </div>
        <div class="column">
            <div class="column-header">
                <h2>IP深度分析报告</h2>
                <div class="count" id="count-ip">0 篇</div>
            </div>
            <ul class="file-list" id="list-ip">
                <li class="loading">正在读取...</li>
            </ul>
        </div>
        <div class="column">
            <div class="column-header">
                <h2>授权联名/营销推广分析报告</h2>
                <div class="count" id="count-brand">0 篇</div>
            </div>
            <ul class="file-list" id="list-brand">
                <li class="loading">正在读取...</li>
            </ul>
        </div>
    </div>
</main>

<footer class="footer">
    <p>IP行业内容导航 | 内容由新文创商学院老贾聊IP搜集整理</p>
</footer>

<script src="files-data.js"></script>
<script>
    function categorizeReport(name) {
        if (/【IP评估报告】/.test(name)) return 'ip';
        if (/【品牌联名报告】/.test(name)) return 'brand';
        if (/【品类报告】/.test(name)) return 'category';
        // Fallback for old naming
        if (/IP[评估深]/i.test(name)) return 'ip';
        if (/联名|授权合作|品牌合作|品牌联名|营销推广分析|营销分析报告/i.test(name)) return 'brand';
        return 'category';
    }

    function buildLink(file) {
        var name = file.displayName || file.name.replace(/\.html$/i, '');
        var encodedName = encodeURIComponent(file.name);
        return '<li><a href="数据分析/' + encodedName + '" title="' + name.replace(/"/g, '&quot;') + '">' + name + '</a></li>';
    }

    function loadFiles() {
        var files = (typeof FILE_LISTS !== 'undefined' ? FILE_LISTS['数据分析'] : []) || [];

        var htmlFiles = files
            .filter(function(f) { return f.name.endsWith('.html'); })
            .sort(function(a, b) {
                if (a.date && b.date) return new Date(b.date) - new Date(a.date);
                if (a.date) return -1;
                if (b.date) return 1;
                return a.name.localeCompare(b.name);
            });

        var catFiles = [];
        var ipFiles = [];
        var brandFiles = [];

        htmlFiles.forEach(function(file) {
            var name = file.displayName || file.name;
            var cat = categorizeReport(name);
            if (cat === 'ip') ipFiles.push(file);
            else if (cat === 'brand') brandFiles.push(file);
            else catFiles.push(file);
        });

        document.getElementById('pageSub').textContent = '共 ' + htmlFiles.length + ' 篇';

        function fillList(listId, countId, files) {
            var listEl = document.getElementById(listId);
            var countEl = document.getElementById(countId);
            countEl.textContent = files.length + ' 篇';
            if (files.length === 0) {
                listEl.innerHTML = '<li class="empty">暂无报告</li>';
            } else {
                listEl.innerHTML = files.map(buildLink).join('');
            }
        }

        fillList('list-category', 'count-category', catFiles);
        fillList('list-ip', 'count-ip', ipFiles);
        fillList('list-brand', 'count-brand', brandFiles);
    }

    loadFiles();
</script>
</body>
</html>
