<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老贾有话说 - 新文创商学院老贾聊IP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(97.5% 0.008 75);
            --surface: oklch(100% 0.005 75);
            --text: oklch(22% 0.02 60);
            --text-secondary: oklch(45% 0.03 60);
            --text-muted: oklch(60% 0.02 60);
            --accent: oklch(45% 0.14 45);
            --accent-light: oklch(92% 0.04 45);
            --border: oklch(85% 0.015 75);
            --border-light: oklch(90% 0.01 75);
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.5rem;
            --space-2xl: 4rem;
            --space-3xl: 6rem;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            padding: var(--space-lg) 0;
            text-align: center;
        }

        .brand {
            font-family: "Noto Serif SC", serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-lg) var(--space-3xl);
        }

        .page-title {
            font-family: "Noto Serif SC", serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 900;
            color: var(--text);
            margin-bottom: var(--space-xs);
        }

        .page-sub {
            font-size: 0.9375rem;
            color: var(--text-muted);
            margin-bottom: var(--space-xl);
        }

        .article-list {
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
        }

        .article-list li {
            border-bottom: 1px solid var(--border-light);
        }

        .article-list li:last-child {
            border-bottom: none;
        }

        .article-item {
            display: block;
            text-decoration: none;
            color: var(--text);
            padding: var(--space-md) var(--space-lg);
            transition: all 0.2s ease;
        }

        .article-item:hover {
            background: var(--accent-light);
        }

        .article-item:hover .article-title {
            color: var(--accent);
        }

        .article-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 4px;
            transition: color 0.2s ease;
            overflow-wrap: break-word;
            width: 100%;
            min-height: 3.2em;
        }

        .article-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .article-views {
            font-size: 0.75rem;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 1px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .footer {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
            border-top: 1px solid var(--border-light);
        }

        .footer p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }
    
/* ========== 返回按钮 ========== */
.back-to-list {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: oklch(30% 0.06 28 / 0.92);
  border: 1px solid oklch(45% 0.10 28 / 0.5);
  border-radius: 999px;
  font-size: 13px;
  color: oklch(96% 0.01 70);
  text-decoration: none;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px oklch(20% 0.02 50 / 0.25);
  transition: all .2s ease;
  letter-spacing: 0.02em;
}
.back-to-list:hover {
  color: oklch(98% 0.02 70);
  border-color: oklch(55% 0.14 28 / 0.7);
  transform: translateX(-2px);
  background: oklch(28% 0.08 28 / 0.95);
  text-decoration: none;
}
.back-to-list svg {
  flex-shrink: 0;
}
@media print { .back-to-list { display: none; } }
</style>
</head>
<body>
<a href="index.html" class="back-to-list" aria-label="返回首页">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
</a>

    <header class="site-header">
        <div class="brand">新文创老贾聊IP</div>
    </header>

    <main class="main">
        <h1 class="page-title">老贾有话说</h1>
        <p class="page-sub" id="articleCount">加载中...</p>

        <ul class="article-list" id="articleList">
            <li class="loading" style="text-align:center;color:var(--text-muted);padding:var(--space-xl) var(--space-lg);">正在读取...</li>
        </ul>
    </main>

    <footer class="footer">
        <p>IP行业内容导航 | 内容由新文创商学院老贾聊IP搜集整理</p>
    </footer>

    <script src="articles-data.js"></script>
    <script>
        function getViews(key, date) {
            let seed = 0;
            for (let i = 0; i < key.length; i++) {
                seed = (seed * 31 + key.charCodeAt(i)) % 1000000007;
            }
            function rand() {
                seed = (seed * 1103515245 + 12345) % 2147483647;
                return seed;
            }
            const baseViews = 230 + (rand() % 461);
            const publishDate = new Date(date);
            const today = new Date();
            const daysDiff = Math.floor((today - publishDate) / 86400000);
            let growth = 0;
            for (let i = 0; i < daysDiff; i++) {
                growth += rand() % 7;
            }
            return baseViews + growth;
        }

        function renderArticles() {
            const listEl = document.getElementById('articleList');
            const countEl = document.getElementById('articleCount');
            if (!listEl || typeof ARTICLES === 'undefined') return;

            countEl.textContent = '共 ' + ARTICLES.length + ' 篇';

            if (ARTICLES.length === 0) {
                listEl.innerHTML = '<li class="loading" style="text-align:center;color:var(--text-muted);padding:var(--space-xl) var(--space-lg);">暂无内容</li>';
                return;
            }

            listEl.innerHTML = ARTICLES.map(article => {
                const views = getViews(article.url, article.date);
                return `
                <li>
                    <a href="${article.url}" class="article-item" target="_blank" rel="noopener" title="${article.title.replace(/"/g, '&quot;')}">
                        <div class="article-title">${article.title}</div>
                        <div class="article-meta">
                            <div class="article-date">${article.date}</div>
                        </div>
                    </a>
                </li>
            `}).join('');
        }
        renderArticles();
    </script>
</body>
</html>
